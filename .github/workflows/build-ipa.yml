name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unzip and generate project
        run: |
          mkdir -p src
          unzip -qo MixBook-src.zip -d src
          cd src
          xcodegen generate
          ls -l

      - name: Build unsigned app
        run: |
          set -o pipefail
          cd src
          xcodebuild -project MixBook.xcodeproj -scheme MixBook -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=NO build

      - name: Package ipa
        run: |
          set -e
          rm -rf Payload MixBook.ipa
          mkdir -p Payload
          cp -R src/build/Build/Products/Release-iphoneos/MixBook.app Payload/
          zip -qry MixBook.ipa Payload
          ls -lh MixBook.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixBook-unsigned-ipa
          path: MixBook.ipa
          if-no-files-found: error
